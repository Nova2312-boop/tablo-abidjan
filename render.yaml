# Déploiement Render : serveur Node + base PostgreSQL. Dashboard Render > New > Blueprint.
services:
  - type: web
    name: tablo-abidjan
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tablo-db
          property: connectionString
      - key: DEMO_OTP
        value: "0"
      - key: TZ
        value: Africa/Abidjan
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SMS_PROVIDER
        value: letexto
      - key: LETEXTO_API_KEY
        sync: false
      - key: LETEXTO_SENDER_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_EXPEDITEUR
        sync: false
databases:
  - name: tablo-db
    plan: free
    region: frankfurt
    databaseName: tablo
